[pytest]
# two groups: the fast tests after every change (python -m pytest -m "not slow", about a minute), and
# all of them before every commit (python -m pytest). A test is slow when it reads a logo or the
# typefaces, or takes two seconds or more.
markers =
    slow: reads a logo or the open typefaces, or takes two seconds or more (run before every commit)
testpaths = tests
